---
version: 2

builds:
  - skip: true

# NOTE: needs to be run with `--parallelism=1`, as goreleaser and
# goreleaser-pro depends on base.
dockers_v2:
  - id: toolchains
    images:
      - "goreleaser/goreleaser-cross-toolchains"
      - "ghcr.io/goreleaser/goreleaser-cross-toolchains"
    tags:
      - "{{ .Tag }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - "latest"
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - ubuntu.sources
    build_args:
      OSXCROSS_VERSION: "{{ .Env.OSXCROSS_VERSION }}"
      DEBIAN_FRONTEND: "{{ .Env.DEBIAN_FRONTEND }}"
      DPKG_ARCH: '{{ trim (trimprefix (trimsuffix .Env.DPKG_ARCH "\"") "\"") }}'
      CROSSBUILD_ARCH: '{{ trim (trimprefix (trimsuffix .Env.CROSSBUILD_ARCH "\"") "\"") }}'
  - id: toolchains-musl
    images:
      - "goreleaser/goreleaser-cross-toolchains"
      - "ghcr.io/goreleaser/goreleaser-cross-toolchains"
    tags:
      - "{{ .Tag }}-musl"
      - "v{{ .Major }}.{{ .Minor }}-musl"
      - "latest-musl"
    dockerfile: musl.Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - cross-make
    build_args:
      OSXCROSS_VERSION: "{{ .Env.OSXCROSS_VERSION }}"
      MUSL_TARGETS: '{{ trim (trimprefix (trimsuffix .Env.MUSL_TARGETS "\"") "\"") }}'
docker_signs:
  - cmd: cosign
    output: true
    args:
      - "sign"
      - "${artifact}"
      - "--yes"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
