#    build_args:
#      OSXCROSS_VERSION: "{{ .Env.OSXCROSS_VERSION }}"
#      # yamllint disable-line rule:line-length
#      MUSL_TARGETS: '{{ trim (trimprefix (trimsuffix .Env.MUSL_TARGETS "\"") "\"") }}'

docker_signs:
  - cmd: cosign
    id: cosign/local
    if: '{{ eq .Env.COSIGN_MODE "local" }}'
    output: true
    args:
      - "sign"
      - "--key"
      - "cosign.key"
      - "${artifact}@${digest}"
      - "--yes"
  - cmd: cosign
    id: cosign/ci
    if: '{{ neq .Env.COSIGN_MODE "local" }}'
    output: true
    args:
      - "sign"
      - "${artifact}@${digest}"
      - "--yes"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
